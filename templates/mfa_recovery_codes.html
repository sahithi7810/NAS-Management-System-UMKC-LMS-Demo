
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MFA Recovery Codes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="card shadow mx-auto" style="max-width: 650px;">
        <div class="card-body p-4">

            <h2 class="text-success">MFA Enabled Successfully!</h2>

            <div class="alert alert-warning">
                Save these recovery codes in a safe place.
                Each code works only once.
                They will not be displayed again.
            </div>

            <div class="row">
                {% for code in recovery_codes %}
                    <div class="col-6 col-md-4 mb-3">
                        <div class="border rounded p-2 text-center fw-bold">
                            {{ code }}
                        </div>
                    </div>
                {% endfor %}
            </div>

            <button class="btn btn-outline-primary w-100 mb-3"
                    onclick="window.print()">
                Print Recovery Codes
            </button>

            <a href="{{ url_for('dashboard') }}"
               class="btn btn-primary w-100">
                Continue to Dashboard
            </a>

        </div>
    </div>

</div>

</body>
</html>
