
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UMKC LMS Demo | Reset Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        :root {
            --umkc-blue: #003b71;
            --umkc-gold: #ffb81c;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-image:
                linear-gradient(
                    rgba(0, 35, 70, .23),
                    rgba(0, 35, 70, .28)
                ),
                url("/static/lms/umkc-campus-bg.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .top-brand {
            background: var(--umkc-blue);
            border-bottom: 4px solid var(--umkc-gold);
            color: white;
            font-size: 22px;
            font-weight: bold;
            padding: 15px 25px;
        }

        .brand-gold {
            color: var(--umkc-gold);
        }

        .page-wrapper {
            min-height: calc(100vh - 65px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
        }

        .reset-card {
            width: 100%;
            max-width: 460px;
            border: 0;
            border-top: 5px solid var(--umkc-gold);
            border-radius: 16px;
            background: rgba(255,255,255,.97);
            box-shadow: 0 12px 35px rgba(0,25,55,.25);
        }

        .form-control {
            height: 49px;
        }

        .btn-umkc {
            background: var(--umkc-blue);
            border: none;
            color: white;
            width: 100%;
            height: 49px;
            font-weight: 600;
        }

        .btn-umkc:hover {
            background: #00549a;
            color: white;
        }

        h2 {
            color: var(--umkc-blue);
            font-weight: 700;
        }
    </style>
</head>

<body>

<header class="top-brand">
    UMKC <span class="brand-gold">|</span> LMS Demo
</header>

<main class="page-wrapper">

    <div class="card reset-card">
        <div class="card-body p-4 p-md-5">

            <h2 class="text-center">Create New Password</h2>

            <p class="text-center text-muted mb-4">
                Enter your new password below.
            </p>

            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <div class="alert alert-warning">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST"
                  action="{{ url_for('reset_password_page', token=token) }}">

                <input type="hidden"
                       name="csrf_token"
                       value="{{ csrf_token }}">

                <div class="mb-3">
                    <label class="form-label" for="password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        minlength="8"
                        autocomplete="new-password"
                        placeholder="Enter new password"
                        required>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="confirm_password">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        class="form-control"
                        minlength="8"
                        autocomplete="new-password"
                        placeholder="Confirm new password"
                        required>
                </div>

                <button type="submit" class="btn btn-umkc">
                    Reset Password
                </button>

            </form>

            <p class="text-center text-muted small mt-4 mb-0">
                UMKC LMS Demo – Unofficial Student Project
            </p>

        </div>
    </div>

</main>

</body>
</html>
