x<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password - NAS Server</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary px-4">
        <span class="navbar-brand">NAS Server</span>
        <a href="{{ url_for('dashboard') }}"
           class="btn btn-light">
            Back to Dashboard
        </a>
    </nav>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0">
                    <div class="card-body p-4">
                        <h2 class="mb-3">Change Password</h2>
                        <p class="text-muted">
                            Update your NAS account password.
                        </p>
                        {% with messages = get_flashed_messages() %}
                            {% for message in messages %}
                                <div class="alret alert-info">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endwith %}
                        <form action="{{ url_for('change_password_page') }}"
                              method="POST">
                            <div class="mb-3">
                                <label class="form-label">
                                    Current Password          
                                </label>
                                <input
                                    type="password"
                                    name="current_password"
                                    class="form-control"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">
                                    New Password
                                </label>
                                <input
                                    type="password"
                                    name="new_password"
                                    class="form-control"
                                    minlength="8"
                                    required>
                            </div>
                            <div class="mb-3"
                                <label class="form-label">
                                    Confirm New Password
                                </label>
                                <input
                                    type="password"
                                    name="confirm_password"
                                    class="form-control"
                                    minlength="8"
                                    required>
                           </div>
                           <button
                               type="submit"
                               class="btn btn-primary w-100">
                               Update Password
                           </button>
                       </form>
                   </div>
               </div>   
           </div>
       </div>
   </div>
</body>                                 
</html>
