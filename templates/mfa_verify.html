
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Login - NAS LMS Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="card shadow mx-auto" style="max-width: 450px;">
        <div class="card-body p-4">

            <h2 class="text-primary">Two-Factor Verification</h2>

            <p>
                Enter your six-digit authenticator code
                or one unused recovery code.
            </p>

            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <div class="alert alert-warning">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST">

                <label class="form-label">Verification code</label>

                <input type="text"
                       name="code"
                       class="form-control mb-3"
                       placeholder="Enter code"
                       autocomplete="one-time-code"
                       required>

                <button class="btn btn-primary w-100" type="submit">
                    Verify and Login
                </button>

            </form>

            <p class="text-muted small mt-3">
                You may also enter an unused recovery code.
            </p>

        </div>
    </div>

</div>

</body>
</html>
